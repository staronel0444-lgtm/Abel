<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoSite — Agent Pipeline Console</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1319; --surface:#171d26; --line:#273142; --ink:#e8edf4; --muted:#93a1b5; --accent:#e0894a; --accent2:#4a9de0; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:22px 24px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:19px; letter-spacing:.2px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; margin-top:4px; }
  main { max-width:1020px; margin:0 auto; padding:24px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  @media (max-width:820px){ main { grid-template-columns:1fr; } }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card h2 { margin:0 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  input, textarea { width:100%; background:#0d1219; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 11px; font:inherit; }
  textarea { resize:vertical; min-height:78px; }
  button { margin-top:16px; width:100%; background:var(--accent); color:#1a1206; border:0; border-radius:8px; padding:11px; font-weight:650; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.55; cursor:progress; }
  .out { white-space:pre-wrap; word-break:break-word; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; color:#cfe0d6; }
  .prompt { background:#0d1219; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; padding:14px; margin-bottom:14px; }
  .pill { display:inline-block; background:#0d1219; border:1px solid var(--line); border-radius:999px; padding:3px 10px; margin:3px 4px 0 0; font-size:12px; }
  .err { color:#ff8f8f; }
  .muted { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Auto<span>Site</span> — Agent Pipeline Console</h1>
  <div class="sub">Automated website-building agents. Live now: <strong>Agent 2 — Prompt Engineer</strong>.</div>
</header>
<main>
  <section class="card">
    <h2>Agent 2 · Input</h2>
    <label>Business name *</label>
    <input id="businessName" placeholder="Rivera & Sons Plumbing" />
    <label>Service type *</label>
    <input id="serviceType" placeholder="Emergency plumbing & drain cleaning" />
    <label>Phone</label>
    <input id="phone" placeholder="(512) 555-0142" />
    <label>Address / service area</label>
    <input id="address" placeholder="Austin, TX" />
    <label>Google reviews (paste full text, one per line or block)</label>
    <textarea id="reviews" placeholder="5★ Maria: Showed up in 30 minutes and fixed it fast...&#10;5★ Tom: Fair price, no surprises, super clean work..."></textarea>
    <label>Competitor website URLs (one per line)</label>
    <textarea id="competitors" placeholder="acmeplumbingatx.com&#10;https://competitor2.com"></textarea>
    <button id="run">Run Agent 2 →</button>
    <div class="muted" id="status" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <h2>Agent 2 · Output</h2>
    <div id="output"><span class="muted">The generated website brief will appear here.</span></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const lines = (v) => v.split(/\n+/).map((s) => s.trim()).filter(Boolean);

$('run').addEventListener('click', async () => {
  const btn = $('run');
  const status = $('status');
  const out = $('output');
  const body = {
    businessName: $('businessName').value,
    serviceType: $('serviceType').value,
    phone: $('phone').value,
    address: $('address').value,
    reviews: $('reviews').value,
    competitors: lines($('competitors').value),
  };
  if (!body.businessName || !body.serviceType) {
    status.innerHTML = '<span class="err">Business name and service type are required.</span>';
    return;
  }
  btn.disabled = true;
  status.textContent = 'Running Agent 2 (reading reviews, visiting competitors, writing the brief)…';
  out.innerHTML = '';
  try {
    const res = await fetch('/api/agents/prompt-engineer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    render(out, data);
    status.textContent = `Done · model ${data.meta?.model || '?'}`;
  } catch (err) {
    out.innerHTML = '<span class="err">' + escapeHtml(err.message) + '</span>';
    status.textContent = '';
  } finally {
    btn.disabled = false;
  }
});

function render(el, d) {
  const chips = (arr) => (arr || []).map((s) => '<span class="pill">' + escapeHtml(s) + '</span>').join('');
  const comp = (d.competitorsFetched || [])
    .map((c) => (c.ok ? '✓ ' : '✗ ') + escapeHtml(c.url) + (c.ok ? '' : ' (' + escapeHtml(c.error || '') + ')'))
    .join('<br>');
  el.innerHTML =
    '<div class="prompt out">' + escapeHtml(d.websitePrompt || '') + '</div>' +
    '<div class="muted">Top selling points</div>' + chips(d.sellingPoints) +
    '<div class="muted" style="margin-top:12px">Recommended sections</div>' + chips(d.recommendation?.sections) +
    '<div class="muted" style="margin-top:12px">Palette</div>' + escapeHtml(d.recommendation?.colorPalette || '—') +
    '<div class="muted" style="margin-top:12px">Gaps to beat</div>' + chips(d.competitorInsights?.gapsToBeat) +
    (comp ? '<div class="muted" style="margin-top:12px">Competitors analyzed</div><div class="out">' + comp + '</div>' : '');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
